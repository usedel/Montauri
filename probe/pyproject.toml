[project]
name = "opencharm-probe"
version = "0.1.0"
description = "OpenCharm 运行时探针：基于 PEP 669 (sys.monitoring) 采集运行时类型与调用信息，写入 SQLite trace 库"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "OpenCharm" }]
dependencies = []  # 纯标准库，零第三方依赖（架构第一原则：独立包，不依赖外壳）

[project.scripts]
opencharm-probe = "opencharm_probe.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opencharm_probe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
