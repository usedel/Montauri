[package]
name = "opencharm-shell"
version = "0.1.0"
description = "OpenCharm IDE shell (Tauri 2 + Monaco)"
edition = "2021"

[lib]
name = "opencharm_shell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
trash = "5"
sha1 = "0.10"
base64 = "0.22"
portable-pty = "0.9"
notify-debouncer-mini = "0.6"
ignore = "0.4"
# PR-H（dx_features_backlog §6.6）：全局搜索正则模式（文件掩码走 ignore 自带 overrides，无需 globset）
regex = "1"
shell-words = "1.1"
# P2 DX：插件包导出/导入（zip）。仅 deflate（默认压缩格式，Windows 资源管理器可直接解压）
zip = { version = "2", default-features = false, features = ["deflate"] }
sysinfo = "0.39.6"
# B3（docs/sqlite_tool_dev_plan.md）：SQLite 数据库工具窗。bundled = 自带 SQLite C 源码（免系统库）；
# 版本锁 0.32.1（离线缓存可用；升级须走 bench/CI 回归并同步 ci/versions.toml）。
rusqlite = { version = "0.32.1", features = ["bundled"] }
