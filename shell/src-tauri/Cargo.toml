[package]
name = "montauri-shell"
version = "0.1.0"
description = "Montauri IDE shell (Tauri 2 + Monaco)"
license = "MIT"
edition = "2021"

[lib]
name = "montauri_shell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
# CSV 查看器「外部打开」（2026-10-11）：超 10MB read_file 守卫的大文件用系统默认程序兜底。
# 走插件而非自写 #[tauri::command]——命令面 206 已压信号线（budgets.toml max_tauri_commands）。
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
trash = "5"
sha1 = "0.10"
base64 = "0.22"
portable-pty = "0.9"
notify-debouncer-mini = "0.6"
ignore = "0.4"
# PR-H（dx_features_backlog §6.6）：全局搜索正则模式（文件掩码走 ignore 自带 overrides，无需 globset）
regex = "1"
shell-words = "1.1"
# P2 DX：插件包导出/导入（zip）。仅 deflate（默认压缩格式，Windows 资源管理器可直接解压）
zip = { version = "2", default-features = false, features = ["deflate"] }
sysinfo = "0.39.6"
# B3（docs/sqlite_tool_dev_plan.md）：SQLite 数据库工具窗。bundled = 自带 SQLite C 源码（免系统库）；
# 版本锁 0.32.1（离线缓存可用；升级须走 bench/CI 回归并同步 ci/versions.toml）。
rusqlite = { version = "0.32.1", features = ["bundled"] }
# B4（docs/toolbox_dev_plan.md §5）：HTTP 客户端内核。
# · rustls-tls = 自带 TLS 实现（免系统 OpenSSL，与 tauri 的 TLS 栈同源）
# · blocking = 与 db_cmds / git_cmds 的 spawn_blocking 范式同构：便于在读取循环里做
#   协作式取消与分块进度上报（async + abort 方案在本项目的 async_runtime 下无法轮询取消）
# 版本锁 0.13.4（随 Cargo.lock；升级须走 bench/CI 回归并同步 ci/versions.toml）。
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
# 单实例 + 启动路由（2026-10-10）：第二实例被拦截退出，argv 转发第一实例按「文件 ∈ 已开
# 工作区」路由。**精确钉版**：2.5.x 要求 tauri ^2.12，与 ci/versions.toml 锁定的 2.11.5
# 冲突；升级本插件须同步评估 tauri 升级（窗口栈 tao/wry 联动，须 bench 回归）。
tauri-plugin-single-instance = { version = "=2.4.1", default-features = false }
same-file = "1.0.6"
