[package]
name = "opencharm-shell"
version = "0.1.0"
description = "OpenCharm IDE shell (Tauri 2 + Monaco)"
edition = "2021"

[lib]
name = "opencharm_shell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
trash = "5"
sha1 = "0.10"
base64 = "0.22"
portable-pty = "0.9"
notify-debouncer-mini = "0.6"
ignore = "0.4"
shell-words = "1.1"
# P2 DX：插件包导出/导入（zip）。仅 deflate（默认压缩格式，Windows 资源管理器可直接解压）
zip = { version = "2", default-features = false, features = ["deflate"] }
