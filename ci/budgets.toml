# OpenCharm 体积 / 规模预算基线（P1-3，落地于 improvement_and_roadmap_report.md §2 P1-3）
#
# 纪律：
#   · 阈值 = 当前实测值 + 明确余量，**只允许通过显式 PR 修改本文件**，不允许脚本自动抬阈值。
#   · 抬高阈值 = 承认一次架构退让，必须在 PR 里写清理由（谁要求、为什么必须涨）。
#   · 降低阈值 = 做了拆分，PR 里应附拆分后的文件。
#   · 语义是"上限"不是"目标"：实际值远低于阈值时不必改本文件。
#
# 用法：node shell/scripts/budget-check.mjs            # 断言，超限非零退出
#      node shell/scripts/budget-check.mjs --report    # 只打印，不改退出码
#
# ── 取数口径警告（本文件所有基线的由来）────────────────────────────
# 本机 PowerShell 5.1 的 ANSI 代码页是 **gb2312**。对**无 BOM 的 UTF-8 源文件**，
# `Get-Content $f`（不带 -Encoding）会按 GBK 解码并**吞掉换行**：
#   style.css 实测 5,410 vs 真实 5,668（少 4.5%）；main.ts 2,503 vs 2,897（少 13%）。
# 丢失比例随文件里 CJK 密度变化，**逐文件不同**，因此用它做基线会得到"看起来对但全是错的"数字。
# 正确口径见文件末尾「口径」，或直接用 `node shell/scripts/budget-check.mjs`。
# ─────────────────────────────────────────────────────────────

[budget]
# —— 文件行数上限（只列"已进超长名单"的文件，避免全量扫描式噪声）——

# style.css：设计系统本体，UI 视觉六批全落在这里。5,050（44c85ea）→ 5,668（HEAD）= +618，
#   是**唯一在 UI 六批期间显著增长的文件**。上限 5,850（余量 182 行 / 3.2%）。
#   批 6+ 若开工，须先按主题拆出分文件，而不是抬这一项。
#   ↳ **2026-10-06 已按此路径拆分**（P0-0）：B4 HTTP → styles/http.css（102 行）、
#     B5 运行日志 → styles/logView.css（170 行），style.css 降至 5,748（拆出 272 行、
#     D-6 新增 21 行、D-8 新增 5 行）。分文件经
#     style.css 顶部 @import 内联进 bundle，audit_tokens.py 已支持 @import 解析
#     （拆分不得缩小审计面）；两个分文件各自设上限，防止静默增长在新文件重演。
style_css_max_lines = 5850

# styles/http.css（B4 HTTP 请求工具，P0-0 拆出）：102 行。上限 125（余量 ~22%）。
styles_http_max_lines = 125

# styles/logView.css（B5 结构化运行日志，P0-0 拆出）：170 行。上限 205（余量 ~20%）。
styles_logview_max_lines = 205

# styles/hotspots.css（A1 运行时热点，2026-10-06 新增）：44 行。上限 60。
#   小文件按**绝对行数**给余量（+36%）而非固定百分比——20% 只剩 9 行，改两条规则就破线。
styles_hotspots_max_lines = 60

# main.ts：2,897 → 2,312（第一刀）→ **2,094（2026-10-06 阶段二拆分第二刀，init 阶段化，−218 行）**。
#   真实故事不是"UI 六批顺带拆了"（同期它是 +58，不是 -336），而是 tech-debt 记录的 TD-014
#   拆分成果（~1,196）已被后续功能吃回 +1,701。
#   **上限逐刀下调：3,000 → 2,600（第一刀）→ 2,400（第二刀）**（拆分后即降阈值，是 budgets.toml
#   顶部纪律第 3 条）。第一刀外提 debugEntry.ts（171）+ menuItems.ts（570）；第二刀外提
#   windowKeys.ts（147）+ windowChrome.ts（73）+ sidebarViews.ts（107）——五个新文件各自设上限
#   （见下），防止"静默增长在新文件里重演"——这是 style.css 拆分时的同一条教训。
#   余量 306 行：新功能仍不得往 main.ts 里堆。
main_ts_max_lines = 2400

# debugEntry.ts（阶段二拆分第一刀新增，2026-10-06）：171 行。上限 205（余量 ~20%）。
#   范围：F5 调试入口链路（启动 / 停止 / Run to Cursor / 求值）。
debug_entry_ts_max_lines = 205

# menuItems.ts（阶段二拆分第一刀新增，2026-10-06）：570 行。上限 690（余量 ~21%）。
#   范围：顶部菜单项 / Search Everywhere 动作表 / 断点右键菜单 / 运行 gutter 菜单的**数据源**
#   （机制分别在 menuBar.ts / quickOpen.ts / menu.ts）。main 私有动作经 setMenuItemsHandlers 注入解环。
menu_items_ts_max_lines = 690

# windowKeys.ts（阶段二拆分第二刀新增，2026-10-06）：147 行。上限 180（余量 ~22%）。
#   范围：window 级 keydown 派发 + Double Shift 手势（所有窗口级快捷键的唯一派发点）。
#   main 私有动作仅 4 个（saveActive / newScratch / closeTab / cycleTab），经 setWindowKeyActions 注入解环。
window_keys_ts_max_lines = 180

# windowChrome.ts（阶段二拆分第二刀新增，2026-10-06）：73 行。上限 90（余量 ~23%）。
#   范围：自绘标题栏（最小化 / 最大化-还原 / 关闭）+ menubar 拖拽 + 边缘 resize 热区。零 main 私有依赖。
window_chrome_ts_max_lines = 90

# sidebarViews.ts（阶段二拆分第二刀新增，2026-10-06）：107 行 → 116（A1 登记第 8 个视图
#   runtime）。上限 130（余量 ~12%）——新增视图会持续吃这里，逼近上限时应先把视图清单
#   数据化（数组驱动）而不是抬阈值。
#   范围：侧栏视图注册表（8 个视图的 onShow/onHide）+ 活动栏点击 + 大纲折叠态（localStorage 持久化）。
#   仅注入 refreshOutline 一个回调。
sidebar_views_ts_max_lines = 130

# hotspotsView.ts（A1 运行时热点视图，2026-10-06 新增）：282 行。上限 350（余量 ~24%）。
#   范围：第 8 个侧栏视图的渲染与动作（`#hp-*` 命名空间）；数据来自 intel_cmds::scan_runtime_hotspots。
#   口径：下半区一律写「未观测到运行」并显式否认"死代码"，改动文案前先看文件头红线。
hotspots_view_ts_max_lines = 350

# git.ts：3,204，Git 迭代 0–6 交付后 44c85ea→HEAD **零变化**（既没涨也没拆）。保持观察。
git_ts_max_lines = 3300

# lsp/client.ts：1,774，同期零变化；含六段 sortText 合并策略（ADR-0009 段位真源）。
lsp_client_ts_max_lines = 1850

# env_cmds.rs：Rust 侧最大单文件，4,937 行 / 32 个命令。
#   **2026-10-06 裁决（P0-4 二选一 → 选「折中：先冻结再择机拆」）**：
#     ① 本上限由"拆分前的临时值"改为**长期值**（不再预期它下降）；
#     ② 真正生效的约束改成**冻结线**——新增的 Python 环境类命令一律落新文件
#        （如 env_cmds_pkg.rs），本文件**只减不增**（纪律写在 env_cmds.rs 文件头）；
#     ③ 拆分（切三块、目标 < 2,500 行）保持候选，排到阶段二，**不设死线**。
#   理由：它是 Rust 侧文件，不影响产物体积与冷启动（ADR-0010 的两个一等目标）；
#   连续两版挂账、43 提交零动作说明"拆它"从未真正进入排期——与其继续挂账消耗
#   清单可信度，不如换成一条当下就可执行、且不会再次失信的规则。
env_cmds_rs_max_lines = 5050

# fs_cmds.rs / git_cmds.rs：3,882 / 1,940（git_cmds 同期 +58），同样防涨。
#   git_cmds 余量仅 10 行，再增长须先拆或显式抬阈值并写理由。
fs_cmds_rs_max_lines = 4000
git_cmds_rs_max_lines = 1950

# intel_cmds.rs（A1 运行时热点数据层，2026-10-06 新增）：472 行。上限 600（余量 ~27%）。
#   范围：只读 trace 库（`SQLITE_OPEN_READ_ONLY`）+ 扫项目 def 做差集；只读命令，不写任何库与项目文件。
#   新增 intel 类命令请**优先落新文件**（同 env_cmds.rs 的冻结线纪律），本文件只承载本视图的差集逻辑。
intel_cmds_rs_max_lines = 600

# —— 命令面 ——
# 195 个 #[tauri::command]（2026-10-06 实测；B4 新增 http_cmds，A1 新增 intel_cmds）。插件化启动前
# Rust 侧会继续膨胀，200 是"必须先讨论插件化"的信号线（超限只告警，见 [policy]）。余量仅 5 个。
max_tauri_commands = 200

# —— 前端产物 ——
# dist/assets 下 JS+CSS 合计上限（KB，未压缩原始体积）= 4,989 实测（2026-10-06 重新构建）+ ~2.6% 余量。
# 仅在 dist/ 存在时检查（未构建则跳过，不算失败）。
# ⚠ **该数字随 dist/ 新鲜度漂移**：陈旧 dist 会残留已删除的依赖分包（实测曾虚报 7,065 KB，
#   其中约 2.08 MB 是已取消的 mermaid/katex），故脚本带新鲜度校验——源码比 dist 新判 STALE 并失败。
#   引用本项数字前先 `cd shell && npm run build`。
max_bundle_kb = 5120

[policy]
# 命令数超限时是否阻断。200 是"该讨论插件化"的信号线而非红线，
# 单人项目里阻断会逼出绕过式写法，故默认只告警。
commands_warn_only = true

# ── 口径 ────────────────────────────────────────────────────────
# 行数 = 按 LF 切分的段数（文件以 LF 结尾时等于 LF 个数，否则 +1）；**含空行**。
# 产物体积 = dist/assets 下 .js + .css 的字节和 / 1024，未压缩。
# 校验方式：node -e "console.log(require('fs').readFileSync(p,'utf8').split(/\r?\n/).length - 1)"
# 对同一文件，`Get-Content -Encoding UTF8` 与 [System.IO.File]::ReadAllLines() 均应给出同值；
# 若三者不一致，以按字节数 LF 的口径为准。
