# —— 前端产物（2026-10-12 拆为两条：安装体积 + 冷启动代理）——
#
# 背景：原单条 max_bundle_kb 量的是 dist/assets 全量。2026-10-12 bundle 瘦身把 monaco-editor
# 归并进独立按需 chunk 后，总量对**冷启动劣化**不再敏感——index 膨胀几百 KB（monaco 静态链
# 回流）总量可能纹丝不动，反之把代码挪去按需 chunk 总量也不动但冷启动实际变快。两个目标
# 各管各的度量，故拆条（用户裁决）：
#
# ① max_bundle_kb = 安装体积代理（dist/assets JS+CSS 合计，未压缩原始体积）。
#    5,120 维持不动（2026-10-12 瘦身后实测 5,106，余量 14 KB）——瘦身改变了结构（index
#    3.18→1.61 MB，monaco 归并单 chunk 3.07 MB），总量几乎持平是「按需加载不减总量、只减
#    关键路径」的正常结果。余量偏紧是刻意的：下一个显著增量的功能要么做按需拆分，要么
#    显式 PR 抬本条并写清理由。
#    5,120 → 5,170（2026-10-14 显式调整：+40 = Monaco inlineCompletions contribution——
#    实参位 ghost text（PyCharm 式灰字）的必要框架，controller/model/ghost views/observable
#    全家桶约 50 KB。落在按需 monaco chunk（3.07→3.12 MB），不进 index 首屏，冷启动代理
#    index_chunk_kb 不动。无法再拆：inline provider 与 suggest 协同依赖同一 model 实例，
#    按需再加载会在 suggest 已开会话里产生双实例竞态——实测已遭 inlineCompletionsSource
#    双池语义反噬，不再二次尝试）。
#    5,170 → 6,050（2026-10-16 显式调整：+880 = monaco-editor 0.52.2 → 0.57.0 升级，
#    用户裁决（滞纳成本控制）。monaco chunk 3.12→3.86 MB（+743 KB）为上游 20 个月内核
#    膨胀（VS Code 同步），按需 contrib 集合未变、无我们代码增长；worker +44 KB、CSS +19 KB。
#    实测 5,987。冷启动代理 index_chunk_kb 不动（index 持平 1.62 MB）。
#    2026-10-16 pytest 测试运行器（docs/pytest_dev_plan.md §4）：预计 +约 43 KB
#    （testView/testRun/testGutter/testTreeCore + testTree.css；testView 动态 import，
#    不进 index 首屏）→ 预估 6,030，仍在 6,050 内（余量吃掉约 68%，剩约 20 KB）。
#    若实测超限：按章程要么拆（结果面板外提 / 按需 chunk）要么显式抬并写清理由——
#    本次范围扩张（产品负责人 2026-10-16 裁决）即理由。
#    ⚠ 陈旧 dist 会残留已删除的依赖分包（实测曾虚报 7,065 KB，其中约 2.08 MB 是已取消的
#    mermaid/katex），故脚本带新鲜度校验——源码比 dist 新判 STALE 并失败。引用数字前先
#    `cd shell && npm run build`。
# ② index_chunk_kb = 冷启动代理（index-*.js 首屏 chunk，窗口出现前必经的解析量）。
#    1,700 = 实测 1,614（2026-10-12 瘦身后）+ ~5% 余量。冷启动红线的产物侧代理——完整红线
#    仍以 bench/collect-metrics.ps1 真机实测为准（< 1,500 ms；瘦身后实测窗口 1,203 ms），
#    本条的作用是把「monaco 静态链回流 index」这类结构回退挡在 PR 阶段（2026-10-12 就是被
#    jsonLiteral/inlineMenu 的静态 import 击穿过，index 一度 3.18 MB）。
max_bundle_kb = 6050
index_chunk_kb = 1700

[policy]
# 命令数超限时是否阻断。200 是"该讨论插件化"的信号线而非红线，
# 单人项目里阻断会逼出绕过式写法，故默认只告警。
commands_warn_only = true

# ── 口径 ────────────────────────────────────────────────────────
# 行数 = 按 LF 切分的段数（文件以 LF 结尾时等于 LF 个数，否则 +1）；**含空行**。
# 产物体积 = dist/assets 下 .js + .css 的字节和 / 1024，未压缩。
# 校验方式：node -e "console.log(require('fs').readFileSync(p,'utf8').split(/\r?\n/).length - 1)"
# 对同一文件，`Get-Content -Encoding UTF8` 与 [System.IO.File]::ReadAllLines() 均应给出同值；
# 若三者不一致，以按字节数 LF 的口径为准。
