# OpenCharm 体积 / 规模预算基线（P1-3，落地于 improvement_and_roadmap_report.md §2 P1-3）
#
# 纪律：
#   · 阈值 = 当前实测值 + 明确余量，**只允许通过显式 PR 修改本文件**，不允许脚本自动抬阈值。
#   · 抬高阈值 = 承认一次架构退让，必须在 PR 里写清理由（谁要求、为什么必须涨）。
#   · 降低阈值 = 做了拆分，PR 里应附拆分后的文件。
#   · 语义是"上限"不是"目标"：实际值远低于阈值时不必改本文件。
#
# 用法：node shell/scripts/budget-check.mjs            # 断言，超限非零退出
#      node shell/scripts/budget-check.mjs --report    # 只打印，不改退出码
#
# ── 取数口径警告（本文件所有基线的由来）────────────────────────────
# 本机 PowerShell 5.1 的 ANSI 代码页是 **gb2312**。对**无 BOM 的 UTF-8 源文件**，
# `Get-Content $f`（不带 -Encoding）会按 GBK 解码并**吞掉换行**：
#   style.css 实测 5,410 vs 真实 5,668（少 4.5%）；main.ts 2,503 vs 2,897（少 13%）。
# 丢失比例随文件里 CJK 密度变化，**逐文件不同**，因此用它做基线会得到"看起来对但全是错的"数字。
# 正确口径见文件末尾「口径」，或直接用 `node shell/scripts/budget-check.mjs`。
# ─────────────────────────────────────────────────────────────

[budget]
