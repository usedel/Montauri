name: 功能建议
description: 提议一个新功能或改进
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        提议前请先读 [README 的「已知边界」与功能范围定位](https://github.com/usedel/Montauri#已知边界)——
        Montauri 是**轻量** IDE：补全/跳转/Hover/诊断 + 运行 + 调试最小闭环 + pytest 测试运行器；
        通用多语言、重型插件生态、独立结果面板/覆盖率等已被明确裁定为**不做**，此类提议会被关闭并指向排期文档。

  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
      description: 描述痛点场景，而非解决方案本身
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 提议的方案
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的备选

  - type: dropdown
    id: weight
    attributes:
      label: 对「轻量」定位的影响评估
      description: 本项目性能与体积是一等目标，新增常驻进程/依赖/后台轮询的门槛很高
      options:
        - 无新增依赖/进程
        - 有新增依赖但按需加载
        - 需要常驻进程或后台轮询（高门槛）
        - 不确定
